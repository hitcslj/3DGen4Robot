# Paper database for "3D Generation for Embodied AI and Robotic Simulation: A Survey".
#
# This file is the single source of truth for the tables in README.md and for the
# Collections / Datasets sections of https://3dgen4robot.github.io.
# After editing it, regenerate the README with:   python scripts/build_readme.py
# (the homepage repo builds its data from this file with scripts/build_all.py).
#
# taxonomy   - sections in display order. `key` is what entries use in `section`;
#              `homepage_category` is the tab name on the project page.
# methods    - one entry per paper:
#     name       short name shown in the first column (required)
#     title      full paper title (required)
#     arxiv      arXiv id, e.g. "2412.01506" (omit if the paper is not on arXiv)
#     paper_url  link to the paper when there is no arXiv id
#     date       "YYYY-MM"; only needed without an arXiv id (tables are sorted by first release)
#     venue      e.g. "CVPR '26", or "arXiv '26" if not yet published (required)
#     section    a taxonomy key (required)
#     project    project page URL
#     code       code URL (a GitHub URL gets a stars badge)
#     authors    BibTeX-style author list, shown on the project page
#     cite_key   key of the entry in the survey's ref.bib, if the paper is cited there
#     in_paper   true if the paper appears in the survey (arXiv 2604.26509)
# datasets   - same fields, plus `details` (README column) and `website`, and a
#              `homepage` block with the attributes shown on the project page
#              (category, type, scale, summary, phys, kin, sim, robot; `url` if the page
#              should link somewhere other than `website`).
# platforms  - simulation platforms table in the README.

